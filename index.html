<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J'Adore — Estética Avanzada</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --dark-bg: #0d0d0d;
            --overlay: rgba(13, 13, 13, 0.55);
            --light-text: #F8F8F8;
            --accent-gold: #c5a059;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--light-text);
            overflow-x: hidden;
        }

        /* Header Navigation */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
        }

        nav a {
            color: var(--light-text);
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-gold);
        }

        /* Hero Section con la Imagen de Fondo */
        .hero {
            position: relative;
            height: 100vh;
            background: linear-gradient(var(--overlay), var(--overlay)), url('estetica.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4rem;
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 300;
            margin-bottom: 35px;
            color: #e0e0e0;
        }

        .btn-booking {
            padding: 15px 40px;
            border: 1px solid var(--accent-gold);
            background: rgba(197, 160, 89, 0.1);
            color: #fff;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(5px);
            transition: all 0.4s ease;
        }

        .btn-booking:hover {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }

        /* Video Showcase Section */
        .video-section {
            position: relative;
            height: 70vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-section video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.5);
        }

        .video-overlay-text {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .video-overlay-text h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            letter-spacing: 2px;
        }

        /* Modulo Citas */
        .booking-section {
            padding: 100px 20px;
            background: #121212;
            text-align: center;
        }

        .booking-container {
            max-width: 600px;
            margin: 40px auto 0;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(10px);
            border-radius: 4px;
        }

        .booking-container input, .booking-container select {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            outline: none;
        }

        .booking-container input:focus {
            border-color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">J'Adore</div>
        <nav>
            <a href="#tratamientos">Tratamientos</a>
            <a href="#experiencia">Experiencia</a>
            <a href="#reservar">Reservar Cita</a>
        </nav>
    </header>

    <!-- Hero con Imagen de Fondo -->
    <section class="hero">
        <h1>J'ADORE ESTÉTICA AVANZADA</h1>
        <p>REDEFINIENDO EL ARTE DE LA BELLEZA Y EL BIENESTAR</p>
        <a href="#reservar" class="btn-booking">Agendar Diagnóstico</a>
    </section>

    <!-- Sección de Vídeo en Movimiento -->
    <section class="video-section">
        <!-- Reemplazar src por tu propio archivo o link MP4 -->
        <video autoplay muted loop playsinline poster="estetica.jpg">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-woman-getting-a-facial-treatment-in-a-spa-41260-large.mp4" type="video/mp4">
        </video>
        <div class="video-overlay-text">
            <h2>Nuestra Experiencia Sensorial</h2>
            <p>Tecnología y alta cosmética Selvert Thermal</p>
        </div>
    </section>

    <!-- Agenda de Citas integratable -->
    <section id="reservar" class="booking-section">
        <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; letter-spacing: 2px;">RESERVA TU CITA</h2>
        <p style="color: #aaa; margin-top: 10px;">Selecciona tu tratamiento y horario preferido</p>

        <div class="booking-container">
            <form onsubmit="event.preventDefault(); alert('Solicitud enviada correctamente');">
                <input type="text" placeholder="Nombre completo" required>
                <input type="tel" placeholder="Teléfono" required>
                <select required>
                    <option value="" disabled selected>Selecciona Tratamiento</option>
                    <option>Diagnóstico Facial Personalizado</option>
                    <option>Estética Avanzada</option>
                    <option>Tratamiento Corporal</option>
                </select>
                <input type="datetime-local" required>
                <button type="submit" class="btn-booking" style="width: 100%;">Confirmar Cita</button>
            </form>
        </div>
    </section>

</body>
</html>
